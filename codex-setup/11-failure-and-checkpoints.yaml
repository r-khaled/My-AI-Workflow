# Checkpoints make long or quota-limited work resumable and auditable.
checkpoints:
  enabled: true
  checkpoint_file_path: null
  progress_log_path: null
  decision_log_path: null
  blocker_report_path: null
  checkpoint_after_each_phase: true

failure_handling:
  maximum_repair_rounds: null
  continue_independent_safe_work_after_blocker: null
  unsupported_configuration_policy: null
  unavailable_model_policy: null
  invalid_skill_policy: null
  diagnostic_failure_policy: null
  quota_or_time_limit_policy: null # Validate, save state, report remaining work, then stop

# These defaults should be preserved unless a reviewed, narrower policy replaces them.
mandatory_stop_gates:
  - unclear_critical_requirement
  - schema_or_data_migration
  - authentication_or_authorization_change
  - public_api_breaking_change
  - production_cloud_iam_or_dns_change
  - destructive_action
  - missing_secret_or_credential
  - new_paid_service_or_material_cost
  - tests_still_failing_after_repair_limit
  - major_architecture_deviation
